<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BSSM Stock — 내 자산</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/mypage.css">
</head>
<body>
<nav>
  <div class="nav-logo">BSSM STOCK</div>
  <div class="nav-links"><a href="index.html">전광판</a><a href="trade.html">거래소</a><a href="mypage.html" class="active">내 자산</a><a href="ranking.html">랭킹</a><a href="quiz.html">퀴즈</a><a href="announce.html">공시</a></div>
  <div class="nav-right">
    <span class="nav-status"><span class="nav-status-dot" id="statusDot"></span><span id="marketStatus">거래중</span></span>
    <span class="nav-user"><strong id="navStudentId">-</strong> · <strong id="navName">-</strong></span>
    <span class="nav-seed" id="navSeed">₩-</span>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">라이트</button>
    <button class="btn-logout" onclick="logout()">로그아웃</button>
  </div>
</nav>
<div class="page-wrap">
  <div class="asset-hero">
    <div class="section-label">총 자산</div>
    <div class="asset-total" id="totalAsset">₩-</div>
    <div class="asset-pnl" id="totalPnl">-</div>
    <div class="asset-grid">
      <div class="asset-item"><div class="asset-item-label">현금 잔액</div><div class="asset-item-val" id="cashVal">₩-</div></div>
      <div class="asset-item"><div class="asset-item-label">주식 평가액</div><div class="asset-item-val" id="stockVal">₩-</div></div>
      <div class="asset-item"><div class="asset-item-label">출석일</div><div class="asset-item-val" id="attendVal">0일</div></div>
    </div>
  </div>

  <div style="margin-bottom:16px;">
    <div class="card">
      <div class="card-header"><span class="card-title">보유 종목</span></div>
      <table>
        <thead><tr>
          <th>종목</th><th class="r">수량</th><th class="r">평균단가</th>
          <th class="r">현재가</th><th class="r">수익률</th><th class="r">평가손익</th>
        </tr></thead>
        <tbody id="holdingBody"></tbody>
      </table>
    </div>
  </div>

  <div style="margin-bottom:16px;">
    <div class="card">
      <div class="card-header"><span class="card-title">예약 주문</span></div>
      <table>
        <thead><tr>
          <th>종목</th><th>유형</th><th class="r">수량</th><th class="r">조건</th><th class="r"></th>
        </tr></thead>
        <tbody id="orderBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title">거래 내역</span><span style="font-size:11px;color:var(--text3)">최근 20건</span></div>
    <table>
      <thead><tr>
        <th>시각</th><th>종목</th><th>유형</th><th class="r">수량</th><th class="r">체결가</th><th class="r">금액</th>
      </tr></thead>
      <tbody id="tradeBody"></tbody>
    </table>
  </div>
</div>
<script src="./js/nav.js"></script>
<script>

function toggleTheme(){
  const h=document.documentElement;
  const d=h.getAttribute("data-theme")==="dark";
  h.setAttribute("data-theme",d?"light":"dark");
  document.getElementById("themeBtn").textContent=d?"다크":"라이트";
  localStorage.setItem("theme",d?"light":"dark");
}
(function(){
  const s=localStorage.getItem("theme")||"dark";
  document.documentElement.setAttribute("data-theme",s);
  const b=document.getElementById("themeBtn");
  if(b)b.textContent=s==="dark"?"라이트":"다크";
})();


async function loadPortfolio(){
  try{
    const r=await fetch(API_BASE+'/portfolio/'+userId);
    const d=await r.json();
    const u=d.user;
    const pnl=d.pnl;
    const pct=d.pnl_pct;
    const isUp=pnl>=0;
    document.getElementById('totalAsset').textContent='₩'+Number(d.total_asset).toLocaleString();
    const pnlEl=document.getElementById('totalPnl');
    pnlEl.textContent=(isUp?'+':'')+Number(pnl).toLocaleString()+'원 ('+(isUp?'+':'')+pct+'%)';
    pnlEl.className='asset-pnl '+(isUp?'up':'dn');
    document.getElementById('cashVal').textContent='₩'+Number(u.seed_money).toLocaleString();
    document.getElementById('stockVal').textContent='₩'+Number(d.stock_value).toLocaleString();
    document.getElementById('attendVal').textContent=u.attend_days+'일';
    document.getElementById('navSeed').textContent='₩'+Number(u.seed_money).toLocaleString();

    // 보유 종목
    const hBody=document.getElementById('holdingBody');
    hBody.innerHTML='';
    if(!d.holdings.length){
      hBody.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:24px">보유 종목 없음</td></tr>';
    }else{
      d.holdings.forEach(h=>{
        const cur=h.current_price||h.avg_price;
        const pnl2=cur-h.avg_price;
        const pct2=((pnl2/h.avg_price)*100).toFixed(2);
        const isU=pnl2>=0;
        const tr=document.createElement('tr');
        tr.innerHTML='<td><div class="holding-stock">'+h.ticker_name+'</div><div class="holding-sub">'+h.market+'</div></td>'
          +'<td class="r">'+h.quantity+'주</td>'
          +'<td class="r" style="font-variant-numeric:tabular-nums">'+Number(h.avg_price).toLocaleString()+'원</td>'
          +'<td class="r" style="font-variant-numeric:tabular-nums">'+Number(cur).toLocaleString()+'원</td>'
          +'<td class="r"><span class="pill '+(isU?'up':'dn')+'">'+(isU?'+':'')+pct2+'%</span></td>'
          +'<td class="r" style="font-variant-numeric:tabular-nums;color:'+(isU?'var(--up)':'var(--dn)')+'">'+( isU?'+':'')+Number(pnl2*h.quantity).toLocaleString()+'원</td>';
        hBody.appendChild(tr);
      });
    }

    // 예약 주문
    const oBody=document.getElementById('orderBody');
    oBody.innerHTML='';
    const r2=await fetch(API_BASE+'/orders/'+userId);
    const orders=await r2.json();
    const pending=orders.filter(o=>o.status==='PENDING');
    if(!pending.length){
      oBody.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:24px">예약 주문 없음</td></tr>';
    }else{
      pending.forEach(o=>{
        const tr=document.createElement('tr');
        const typeClr=o.trade_type==='BUY'?'up':'dn';
        tr.innerHTML='<td style="font-weight:500">'+o.ticker_name+'</td>'
          +'<td><span class="pill '+typeClr+'">'+o.trade_type+'</span></td>'
          +'<td class="r">'+o.quantity+'주</td>'
          +'<td class="r" style="font-variant-numeric:tabular-nums">'+(o.limit_price?Number(o.limit_price).toLocaleString()+'원':'시간예약')+'</td>'
          +'<td class="r"><button class="btn" style="font-size:11px;padding:4px 10px" onclick="cancelOrder('+o.order_id+',this)">취소</button></td>';
        oBody.appendChild(tr);
      });
    }

    // 거래 내역
    const tBody=document.getElementById('tradeBody');
    tBody.innerHTML='';
    d.trade_logs.slice(0,20).forEach(t=>{
      const isB=t.trade_type==='BUY';
      const dt=new Date(t.created_at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      const tr=document.createElement('tr');
      tr.innerHTML='<td style="font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums">'+dt+'</td>'
        +'<td style="font-weight:500">'+t.ticker_name+'</td>'
        +'<td><span class="trade-type '+t.trade_type+'">'+t.trade_type+'</span></td>'
        +'<td class="r">'+t.quantity+'주</td>'
        +'<td class="r" style="font-variant-numeric:tabular-nums">'+Number(t.price).toLocaleString()+'원</td>'
        +'<td class="r" style="font-variant-numeric:tabular-nums;color:'+(isB?'var(--up)':'var(--dn)')+'">'+( isB?'-':'+')+''+Number(t.price*t.quantity).toLocaleString()+'원</td>';
      tBody.appendChild(tr);
    });
    if(!d.trade_logs.length)tBody.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:24px">거래 내역 없음</td></tr>';
  }catch(e){console.error(e);}
}

async function cancelOrder(id,btn){
  btn.disabled=true;btn.textContent='취소 중...';
  try{
    const r=await fetch(API_BASE+'/orders/'+id,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:Number(userId)})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error);
    loadPortfolio();
  }catch(e){alert('오류: '+e.message);btn.disabled=false;btn.textContent='취소';}
}

loadPortfolio();

</script>
</body>
</html>
